services:
  web:
    build:
      context: .
      target: runtime
    image: voyager-web:prod
    # ⚠️ NÃO indente as linhas de continuação. No escalar dobrado (`>`) do YAML,
    # linha MAIS indentada que a primeira PRESERVA a quebra — e a quebra dentro
    # do `sh -c "..."` é separador de comando para o shell. Com a indentação
    # antiga, o shell executava `gunicorn ... -b 0.0.0.0:8000` sozinho e as
    # flags viravam comandos seguintes que nunca rodavam: produção subiu por
    # meses com **1 worker `sync` e timeout de 30 s** em vez de 12 `gthread`
    # com 300 s (`[INFO] Using worker: sync` no log, um único "Booting worker").
    # Efeito: qualquer requisição lenta parava o site inteiro até o arbiter
    # matar o worker. Descoberto em 09/09/2026 caçando o 500 da API de leads.
    command: >
      sh -c "python manage.py collectstatic --noinput &&
      python manage.py migrate --noinput &&
      gunicorn core.wsgi:application -b 0.0.0.0:8000
      -w 12 -k gthread --threads 6 --timeout 300 --graceful-timeout 30
      --access-logfile - --error-logfile -"
    env_file: .env
    volumes:
      - .:/app
      - static:/app/staticfiles
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/v1/health/liveness/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always
  
  worker_manual:
    image: voyager-web:prod
    command: python manage.py rqworker manual
    env_file: .env
    volumes:
      - .:/app
    depends_on:
      web:
        condition: service_healthy
    deploy:
      replicas: 2
    restart: always  

  scheduler:
    image: voyager-web:prod
    command: python manage.py djen_register_schedules_and_run
    env_file: .env
    volumes:
      - .:/app
    depends_on:
      web:
        condition: service_healthy
    restart: always

  worker_classificacao:
    image: voyager-web:prod
    command: python manage.py rqworker classificacao
    env_file: .env
    volumes:
      - .:/app
    depends_on:
      web:
        condition: service_healthy
    deploy:
      replicas: 8
    restart: always

  worker_leads_consumo:
    image: voyager-web:prod
    command: python manage.py rqworker leads_consumo
    env_file: .env
    volumes:
      - .:/app
    depends_on:
      web:
        condition: service_healthy
    deploy:
      replicas: 4
    restart: always

  # Consumers do stream de enrichment. XREADGROUP distribui entries
  # entre consumers do mesmo group — escalar replicas dá throughput x N.
  # Workers concorrentes podem ter racing em upsert de Parte, mas as
  # partial unique constraints (uniq_parte_*) tornam o pattern
  # bulk_create(ignore_conflicts) idempotente.
  # Drainer LEGACY: consome o stream antigo `voyager:enrichment:results`
  # (sem suffix), onde estão entries publicadas antes do deploy do shard.
  # Workers atuais publicam apenas nos streams sharded — assim que o XLEN
  # do legacy zerar, este service pode ser desligado.
  enrichment_drainer:
    image: voyager-web:prod
    command: python manage.py enrichers_drain --partition legacy --batch-size 1000 --block-ms 500
    env_file: .env
    volumes:
      - .:/app
    depends_on:
      web:
        condition: service_healthy
    deploy:
      replicas: 1
    restart: always

  # Drainers SHARDED: 1 instância por partition (hash(process_id) % N).
  # Cada partition tem seu próprio stream físico — sem cruzamento de
  # DELETE+INSERT no mesmo process_id entre drainers, sem deadlock.
  # N=4 (vide enrichers/stream.py:STREAM_PARTITIONS).
  enrichment_drainer_p0:
    image: voyager-web:prod
    command: python manage.py enrichers_drain --partition 0 --batch-size 1000 --block-ms 500
    env_file: .env
    volumes:
      - .:/app
    depends_on:
      web:
        condition: service_healthy
    deploy:
      replicas: 1
    restart: always

  enrichment_drainer_p1:
    image: voyager-web:prod
    command: python manage.py enrichers_drain --partition 1 --batch-size 1000 --block-ms 500
    env_file: .env
    volumes:
      - .:/app
    depends_on:
      web:
        condition: service_healthy
    deploy:
      replicas: 1
    restart: always

  enrichment_drainer_p2:
    image: voyager-web:prod
    command: python manage.py enrichers_drain --partition 2 --batch-size 1000 --block-ms 500
    env_file: .env
    volumes:
      - .:/app
    depends_on:
      web:
        condition: service_healthy
    deploy:
      replicas: 1
    restart: always

  enrichment_drainer_p3:
    image: voyager-web:prod
    command: python manage.py enrichers_drain --partition 3 --batch-size 1000 --block-ms 500
    env_file: .env
    volumes:
      - .:/app
    depends_on:
      web:
        condition: service_healthy
    deploy:
      replicas: 1
    restart: always

  nginx:
    image: nginx:alpine
    expose:
      - "80"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro
      - static:/var/www/static:ro
    depends_on:
      web:
        condition: service_healthy
    restart: always

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - nginx
    restart: always

volumes:
  static:
