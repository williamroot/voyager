<script>
function showcase(){
  return {
    modelos:{}, info:{}, showCards:false, single:null, selected:{}, modo:'single', analiseIds:{},
    file:null, dragover:false, running:false, results:{}, progress:0, steps:[], _timer:null,
    step:1, exporting:false, upStat:'', redirecting:false,
    init(){
      this.modelos = JSON.parse(document.getElementById('showcase-modelos').textContent||'{}');
      this.info = JSON.parse(document.getElementById('showcase-info').textContent||'{}');
      // primeira versão disponível vira o default do single
      const av = Object.keys(this.modelos).filter(v=>this.modelos[v].disponivel);
      this.single = av[0] || Object.keys(this.modelos)[0] || null;
      av.forEach(v=>this.selected[v]=true);
    },
    // ---------- wizard ----------
    get isZip(){ return !!(this.file && /\.zip$/i.test(this.file.name)) },
    get canStep2(){ return !!this.file },                       // passo 2 exige arquivo
    get canStep3(){ return this.running || this.hasResult },    // passo 3 exige extração
    stepState(n){ // 'done' | 'now' | 'todo'
      if(n===this.step) return 'now';
      if(n<this.step) return 'done';
      return 'todo';
    },
    goStep(n){ // navegação guardada — pode voltar, não pode pular pré-requisito
      if(n===this.step) return;
      if(n>=2 && !this.canStep2) return;
      if(n>=3 && !this.canStep3) return;
      this.step=n;
    },
    novoDoc(){ // ↻ recomeça do zero
      this.clearFile(); this.running=false; this.results={}; this.analiseIds={};
      this.steps=[]; this.progress=0; clearInterval(this._timer);
      this.step=1;
    },
    badgeLabel(s){ return {campeao:'★ campeão', treino:'em treino', geracao1:'geração 1', padrao:'estável'}[s]||s },
    get selectedVers(){ return Object.keys(this.modelos).filter(v=>this.selected[v] && this.modelos[v].disponivel) },
    isSel(v){ return !!this.selected[v] },
    toggle(v){ if(!this.modelos[v].disponivel) return; this.selected[v]=!this.selected[v] },
    get canRun(){ if(!this.file||this.running) return false;
      return this.modo==='single' ? (this.single && this.modelos[this.single]?.disponivel) : this.selectedVers.length>0 },
    get hasResult(){ return Object.keys(this.results).length>0 },
    fmtSize(b){ return b>1e6 ? (b/1e6).toFixed(1)+' MB' : Math.round(b/1024)+' KB' },
    tempo(r){ return r.elapsed_ms>=1000 ? (r.elapsed_ms/1000).toFixed(1)+'s' : r.elapsed_ms+'ms' },
    onDrop(e){ this.dragover=false; const f=e.dataTransfer.files[0]; if(f) this.onFile(f) },
    onFile(f){ if(!f) return; const n=f.name.toLowerCase(); const ok = n.endsWith('.pdf')||n.endsWith('.zip')||(f.type&&(f.type.indexOf('pdf')>=0||f.type.indexOf('zip')>=0)); if(!ok){alert('Envie um PDF ou um ZIP dos autos (TJSP)');return} this.file=f; this.results={} },
    clearFile(){ this.file=null; this.results={} },
    async exportar(fmt){  // baixa a análise em md/pdf/json (do próprio payload, on-device)
      const payload = this.results[this.single]; if(!payload || payload.erro) return;
      this.exporting=true;
      try{
        const csrf=(document.cookie.match(/csrftoken=([^;]+)/)||[])[1]||'';
        const resp=await fetch(`/dashboard/api/showcase/export/${fmt}`,{method:'POST',
          headers:{'Content-Type':'application/json','X-CSRFToken':csrf},credentials:'same-origin',
          body:JSON.stringify(payload)});
        if(!resp.ok){ alert(resp.status===501?'Exportação PDF indisponível no servidor':'Falha ao exportar ('+resp.status+')'); return; }
        const blob=await resp.blob();
        const cd=resp.headers.get('Content-Disposition')||''; const mm=cd.match(/filename="?([^"]+)"?/);
        const nome=mm?mm[1]:`analise.${fmt}`;
        const url=URL.createObjectURL(blob); const a=document.createElement('a');
        a.href=url; a.download=nome; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
      }catch(e){ alert('Erro ao exportar: '+e.message); }
      finally{ this.exporting=false; }
    },
    _csrf(){ return (document.cookie.match(/csrftoken=([^;]+)/)||[])[1]
             || document.querySelector('meta[name=csrf-token]')?.content || '' },
    // fetch com TIMEOUT (AbortController). O fetch do browser não tem timeout: um
    // chunk que estola no tunnel congestionado penduraria pra SEMPRE → "enviando…"
    // infinito. Aqui aborta em `ms`, o AbortError cai no retry, e se esgotar as
    // tentativas o upload falha com mensagem clara (não trava a tela).
    async _fetchTO(url, opts, ms){
      const ac = new AbortController();
      const t = setTimeout(()=>ac.abort(), ms);
      try{ return await fetch(url, {...opts, signal: ac.signal}); }
      finally{ clearTimeout(t); }
    },
    _upTick(feitos, voo, total, t0){ // feedback ao vivo do upload (nunca deixa parecer travado)
      const secs=(performance.now()-t0)/1000;
      const mb=(feitos*8*1024*1024)/1e6;
      this.progress = Math.min(4 + Math.round(feitos/total*56), 60); // 4→60% = fase upload
      this.upStat = `${feitos}/${total} chunks${voo?` · ${voo} em voo`:''} · ${mb.toFixed(0)} MB · ${(mb/Math.max(secs,0.1)).toFixed(1)} MB/s`;
    },
    // fases: upload (fatiar+enviar chunks) → extração (poll dos jobs). A barra e
    // as etapas são movidas por SINAIS REAIS (progresso do upload; etapa do job),
    // não por um timer estimado.
    _setSteps(fase){
      if(fase==='upload'){
        this.steps=[
          {label:'Enviando os autos (fatiado, em paralelo)',now:true,done:false},
          {label:'Remontando e validando no servidor',now:false,done:false},
          {label:'Modelo lendo e extraindo (na fila / rodando)',now:false,done:false},
          {label:'Ficha pronta',now:false,done:false},
        ];
      }
    },
    _advanceSteps(k){ // marca até a etapa k concluída, k+... como 'now'
      for(let i=0;i<this.steps.length;i++){ this.steps[i].done=i<k; this.steps[i].now=i===k }
    },
    async _sha256File(f){ // sha256 hex do File inteiro (integridade fim-a-fim)
      try{
        const buf=await f.arrayBuffer();
        const d=await crypto.subtle.digest('SHA-256', buf);
        return Array.from(new Uint8Array(d)).map(b=>b.toString(16).padStart(2,'0')).join('');
      }catch(e){ return '' } // navegador antigo / arquivo enorme sem RAM → pula (servidor ainda valida tamanho+contagem)
    },
    async _md5(buf){ // md5 hex de um chunk (integridade por-chunk). Fallback: '' se indisponível.
      try{ // Web Crypto não tem MD5; usamos um md5 mínimo inline
        return md5FromBuffer(new Uint8Array(buf));
      }catch(e){ return '' }
    },
    // ---------- upload em chunks (aguenta ~1GB, cada chunk << 100MB do Cloudflare) ----------
    async _uploadChunked(file){
      const CHUNK = 8*1024*1024;                     // 8 MB por chunk
      const total = Math.ceil(file.size / CHUNK);
      const csrf = this._csrf();
      // INIT
      const initResp = await fetch('/dashboard/api/showcase/upload/init/', {
        method:'POST', credentials:'same-origin',
        headers:{'Content-Type':'application/json','X-CSRFToken':csrf},
        body: JSON.stringify({filename:file.name, size:file.size, total_chunks:total,
                              content_type:file.type||'application/octet-stream'})});
      if(!initResp.ok){ const j=await initResp.json().catch(()=>({})); throw new Error(j.erro||('init HTTP '+initResp.status)); }
      const {upload_id} = await initResp.json();
      // ENVIA CHUNKS — concorrência limitada + retry com backoff + TIMEOUT por chunk.
      let enviados=0, emVoo=0; const t0=performance.now();
      this.upStat = `0/${total} chunks · preparando envio…`; this.progress=4;
      const sendOne = async (idx)=>{
        const start=idx*CHUNK; const blob=file.slice(start, Math.min(start+CHUNK, file.size));
        const buf=await blob.arrayBuffer(); const md5=await this._md5(buf);
        emVoo++; this._upTick(enviados, emVoo, total, t0);
        try{
          for(let attempt=0; attempt<6; attempt++){
            try{
              const r=await this._fetchTO(`/dashboard/api/showcase/upload/chunk/${upload_id}/${idx}/`,{
                method:'POST', credentials:'same-origin',
                headers:{'X-CSRFToken':csrf, ...(md5?{'X-Chunk-MD5':md5}:{})}, body:buf}, 90000);
              if(r.ok){ enviados++; this._upTick(enviados, emVoo-1, total, t0); return; }
              if(r.status===410){ throw new Error('upload expirou — recarregue a página e reenvie'); }
              if(r.status===413){ const j=await r.json().catch(()=>({})); throw new Error(j.erro||'arquivo grande demais'); }
              // 422 (md5) / 5xx / reset → cai no retry
            }catch(e){
              if(e && /expirou|grande demais/.test(e.message||'')) throw e; // erro terminal: não retenta
              if(attempt===5) throw new Error(`chunk ${idx+1}/${total} falhou após 6 tentativas (${e.name==='AbortError'?'timeout':(e.message||'rede')})`);
            }
            await new Promise(res=>setTimeout(res, 400*Math.pow(2,attempt) + Math.random()*250)); // backoff
          }
        } finally { emVoo--; this._upTick(enviados, emVoo, total, t0); }
      };
      // pool de workers consumindo a fila de índices. Concorrência 2 (não 4): o
      // Cloudflare Tunnel free tem banda agregada limitada e N chunks de 8MB em
      // paralelo saturam a MESMA via que serve o site — num upload de ~1GB isso
      // deixava o site público intermitente (000) pra outros usuários. 2 mantém o
      // ganho do paralelo sem estrangular o tunnel. Subir só com rota dedicada.
      const CONC = 2;
      let next=0;
      const worker=async()=>{ while(next<total){ const i=next++; await sendOne(i); } };
      await Promise.all(Array.from({length: CONC}, ()=>worker()));
      // FINISH — remonta+valida no servidor, enfileira, devolve job_id por versão
      this._advanceSteps(1); this.progress=64; this.upStat='remontando e validando no servidor…';
      // sha256 do arquivo inteiro carrega TUDO na RAM (f.arrayBuffer): em arquivo
      // grande (~1GB) isso trava/estoura. Pula acima de 256MB — a integridade já
      // está garantida pelo md5 POR-CHUNK + contagem + tamanho no servidor.
      const sha = file.size > 256*1024*1024 ? '' : await this._sha256File(file);
      const vers = this.modo==='single' ? [this.single] : this.selectedVers;
      const finResp = await this._fetchTO(`/dashboard/api/showcase/upload/finish/${upload_id}/`,{
        method:'POST', credentials:'same-origin',
        headers:{'Content-Type':'application/json','X-CSRFToken':csrf},
        body: JSON.stringify(vers.length>1 ? {versoes:vers, sha256:sha} : {versao:vers[0], sha256:sha})}, 300000);
      if(!finResp.ok){ const j=await finResp.json().catch(()=>({})); throw new Error(j.erro||('finish HTTP '+finResp.status)); }
      const {jobs} = await finResp.json();  // {versao: job_id}
      return jobs;
    },
    // ---------- polling dos jobs até done/erro ----------
    async _pollJob(ver, jobId){
      while(true){
        await new Promise(r=>setTimeout(r, 2000));
        let st;
        try{
          const r=await fetch(`/dashboard/api/showcase/job/${jobId}/`, {credentials:'same-origin'});
          if(r.status===404){ this.results[ver]={erro:'job expirou (sem resposta do modelo a tempo)', versao:ver}; return; }
          st=await r.json();
        }catch(e){ continue; } // erro de rede transitório no poll → tenta de novo
        // move a barra/etapas pela etapa REAL do job
        if(st.status==='processando'){ this._advanceSteps(2); this.progress=Math.max(this.progress, 65+(st.progresso||0)*0.3); }
        if(st.status==='done'){
          this._advanceSteps(4); this.progress=100;
          this.results[ver] = st.resultado || {erro:'sem resultado', versao:ver};
          this.analiseIds[ver] = st.analise_id || null;   // link compartilhável (UUID)
          return;
        }
        if(st.status==='erro'){
          this.results[ver] = (st.resultado && st.resultado.erro) ? st.resultado
                              : {erro: st.erro||'erro na extração', versao:ver};
          return;
        }
      }
    },
    async extrair(){
      if(!this.canRun) return;
      this.step=3;   // clicar Extrair avança pro passo 3
      this.running=true; this.results={}; this.progress=2; this.upStat=''; this._setSteps('upload');
      try{
        const jobs = await this._uploadChunked(this.file);   // {versao: job_id}
        this._advanceSteps(2);
        // poll de todos os jobs em paralelo (compare = N jobs)
        await Promise.all(Object.entries(jobs).map(([ver,jid])=>this._pollJob(ver,jid)));
      }catch(e){
        const vers = this.modo==='single' ? [this.single] : this.selectedVers;
        vers.forEach(ver=>{ if(!this.results[ver]) this.results[ver]={erro:String(e.message||e), versao:ver}; });
      }
      this.steps.forEach(s=>{s.done=true;s.now=false}); this.progress=100;
      setTimeout(()=>{ this.running=false },350);
      // redireciona pro SALVO (página compartilhável por UUID) assim que termina —
      // modo single, extração OK e persistida. Mesma ficha + link pra compartilhar.
      // Comparação (N modelos) NÃO redireciona (há N análises); persistência falha
      // (sem analise_id) cai no render inline — graceful, sem prender o usuário.
      if(this.modo==='single'){
        const aid=this.analiseIds[this.single];
        const ok=this.results[this.single] && !this.results[this.single].erro;
        if(aid && ok){ this.redirecting=true;
          setTimeout(()=>{ window.location.href=`/dashboard/ia/showcase/a/${aid}/`; }, 850); }
      }
    },
    // ---------- render ----------
    esc(s){ if(s==null) return ''; return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])) },
    na(v){ return (v==null||v==='') ? '<span class="sc-na">não informado</span>' : this.esc(v) },
    money(v){ if(v==null||v==='') return '<span class="sc-na">—</span>';
      const n=Number(String(v).replace(/[^\d.,-]/g,'').replace(/\.(?=\d{3})/g,'').replace(',','.'));
      return isNaN(n)? this.esc(v) : 'R$ '+n.toLocaleString('pt-BR',{minimumFractionDigits:2}) },
    papelCor(p){ const m={EXEQUENTE:'#22c55e',BENEFICIARIO:'#22c55e',HERDEIRO:'#a855f7',SUCESSOR:'#a855f7',
      ESPOLIO:'#8b5cf6',INVENTARIANTE:'#f59e0b',CONJUGE:'#ec4899',CESSIONARIO:'#06b6d4',CEDENTE:'#0ea5e9',
      ADVOGADO:'#64748b',EXECUTADO:'#ef4444',FALECIDO:'#6b7280'}; return m[(p||'').toUpperCase()]||'#3b82f6' },
    // polo da parte: ativo (recebe o crédito) | passivo (paga) | repr (advogado) | outro.
    // Só o polo ATIVO tem valor a receber por definição — o passivo (Fazenda/ente) NÃO
    // recebe, então não mostramos "a receber —" pra ele (a menos que exista valor real).
    _poloParte(papel){
      const P=(papel||'').toUpperCase();
      if(/CEDENTE/.test(P)) return {polo:'ativo'};                       // era credor, cedeu
      if(/EXEQUENTE|EXEQ|BENEFICI|HERDEIR|SUCESSOR|ESP[OÓ]LIO|INVENTARIANT|CESSION|C[OÔ]NJUGE|CREDOR/.test(P)) return {polo:'ativo'};
      if(/EXECUTAD|ENTE|FAZENDA|DEVEDOR|MUNIC|ESTADO|UNI[AÃ]O|INSS/.test(P)) return {polo:'passivo'};
      if(/ADVOGAD|PROCURADOR|REPRESENT|PATRONO|CAUSID/.test(P)) return {polo:'repr'};
      return {polo:'outro'};
    },
    // card de UMA parte. forceValor=true (polo ativo) sempre mostra o bloco de valor;
    // senão, só mostra se houver valor/pagamento REAL (não polui o passivo com "—").
    // enquadra o ADVOGADO num polo pela COOCORRÊNCIA de documento: a procuração
    // (ou habilitação) vincula o advogado ao outorgante; se ele divide o mesmo
    // doc_id com uma parte de polo conhecido, herda esse polo. Substabelecimento
    // é adv→adv (não vincula polo) e o caso ambíguo → null (abstém, não chuta).
    _advogadoPolo(adv, partes){
      const meus=new Set();
      (Array.isArray(adv.docs_origem)?adv.docs_origem:[]).forEach(o=>{
        const c=this._normNome(o&&o.doc_classe);
        if((c==='PROCURACAO'||c==='HABILITACAOHERDEIROS') && o&&o.doc_id) meus.add(o.doc_id);
      });
      if(!meus.size) return null;
      const cont={ativo:0,passivo:0};
      partes.forEach(p=>{ if(p===adv) return;
        const pl=this._poloParte(p.papel).polo; if(pl!=='ativo'&&pl!=='passivo') return;
        (Array.isArray(p.docs_origem)?p.docs_origem:[]).forEach(o=>{ if(o&&meus.has(o.doc_id)) cont[pl]++; });
      });
      if(cont.ativo && !cont.passivo) return 'ativo';
      if(cont.passivo && !cont.ativo) return 'passivo';
      return null;   // sem sinal ou ambíguo → não atribui
    },
    _parteCard(p, forceValor){
      const cor=this.papelCor(p.papel); const esp=p.espolio||p.espolio_de;
      const ehAdvogado=/ADVOGAD|PROCURADOR|REPRESENT|PATRONO|CAUSID/.test((p.papel||'').toUpperCase());
      const vr=this._valorReceber(p); const rec=this._recebido(p);
      const abstVal=p.valor_a_receber && p.valor_a_receber.abstido;
      const stv=(p.valor_a_receber && p.valor_a_receber.status)||null;
      const temValorReal=(vr!=null || rec.tem || p.saldo!=null);
      const inicial=((p.nome||'?').trim().charAt(0)||'?').toUpperCase();
      let c=`<div class="sc-pcard" style="--pc:${cor}">`;
      c+=`<div class="sc-pcard-top">
        <span class="sc-pcard-av" style="background:${cor}22;color:${cor};border-color:${cor}55">${this.esc(inicial)}</span>
        <div class="sc-pcard-id">
          <div class="sc-pcard-nome">${this.na(p.nome)}</div>
          <div class="sc-pcard-tags">
            ${p.papel?`<span class="sc-papel" style="background:${cor}22;color:${cor}">${this.esc(p.papel)}</span>`:''}
            ${p.papel_conflito?`<span class="sc-papel" style="background:#ef444422;color:#ef4444">papel em conflito</span>`:''}
            ${this.confBadge(p.confianca)}
          </div>
        </div>`;
      if(stv){ const sc=this._statusValorCor(stv);
        c+=`<span class="sc-stpill" style="background:${sc}22;color:${sc};border-color:${sc}55" title="situação do valor desta parte">${this.esc((p.valor_a_receber.status_rotulo)||stv)}</span>`; }
      c+=`</div>`;
      // linha de documento de identidade — CPF/CNPJ mascarado + OAB (advogado)
      const doc=p.cpf_cnpj?this._mascaraDoc(p.cpf_cnpj):null;
      const ehCnpj=doc&&String(p.cpf_cnpj).replace(/\D/g,'').length===14;
      const oab=p.oab||p.oab_numero||(p.registro_oab);
      const idbits=[];
      if(doc) idbits.push(`<span class="sc-idchip"><i>${ehCnpj?'CNPJ':'CPF'}</i>${this.esc(doc)}</span>`);
      if(oab) idbits.push(`<span class="sc-idchip sc-idchip-oab"><i>OAB</i>${this.esc(String(oab).replace(/^\s*OAB[\/\s:-]*/i,''))}</span>`);
      if(idbits.length) c+=`<div class="sc-pcard-id2">${idbits.join('')}</div>`;
      const sub=[];
      if(esp) sub.push('espólio de '+this.esc(esp===true?'—':esp));
      if(p.abstido) sub.push('<span style="color:#f59e0b">modelo absteve o papel</span>');
      if(sub.length) c+=`<div class="sc-pcard-sub">${sub.join('&nbsp;·&nbsp;')}</div>`;
      // "consta em" — de quais DOCUMENTOS a parte foi lida (proveniência clara).
      // docs_origem = [{doc_classe,...}] OU lista de strings — normaliza pra classe.
      const orig=(Array.isArray(p.docs_origem)?p.docs_origem:[])
        .map(x=> (typeof x==='string') ? x : (x && (x.doc_classe||x.classe)))
        .filter(Boolean);
      if(orig.length){
        const rots=[...new Set(orig.map(x=>this._classeRot(x)).filter(Boolean))];
        if(rots.length) c+=`<div class="sc-pcard-orig"><span>consta em</span> ${rots.map(r=>`<em>${this.esc(r)}</em>`).join(' · ')}</div>`;
      }
      // VALOR — advogado NUNCA recebe o crédito (sem bloco de valor). Parte com
      // valor real → bloco completo (a receber é o herói; já-recebido/saldo só se
      // houver). Polo ativo SEM valor → nota compacta e honesta, em vez do bloco
      // grande de "MODELO ABSTEVE" repetido em cada card (era o que confundia).
      if(!ehAdvogado){
        if(temValorReal){
          c+=`<div class="sc-pcard-vals">
            <div class="sc-val sc-val-hero"><span>a receber</span><b>${vr!=null? this.money(vr) : '<span class="sc-na">—</span>'}</b></div>`;
          if(rec.tem) c+=`<div class="sc-val"><span>já recebido</span><b>${rec.txt}</b></div>`;
          if(p.saldo!=null) c+=`<div class="sc-val"><span>saldo</span><b>${this.money(p.saldo)}</b></div>`;
          c+=`</div>`;
        } else if(forceValor){
          c+=`<div class="sc-pcard-semval" title="${this.esc((p.valor_a_receber&&p.valor_a_receber.motivo_abstencao)||'o modelo não atribuiu um valor individual a esta parte')}">${abstVal?'modelo absteve o valor desta parte':'sem valor individual atribuído'}</div>`;
        }
      }
      c+=`</div>`;
      return c;
    },
    confBadge(c){ const m={alta:'#22c55e',media:'#f59e0b',baixa:'#ef4444'}; const k=(c||'').toLowerCase();
      return m[k]? `<span class="sc-conf" style="color:${m[k]}">● confiança ${this.esc(c)}</span>`:'' },
    // helpers de valor (contrato real)
    _num(v){ if(v==null||v==='') return null; if(typeof v==='number') return v;
      const n=Number(String(v).replace(/[^\d.,-]/g,'').replace(/\.(?=\d{3}\b)/g,'').replace(',','.')); return isNaN(n)?null:n },
    _valorReceber(p){ // valor_a_receber={valor,...} OU valores_a_receber=[{valor},...]
      if(p.valor_a_receber && p.valor_a_receber.valor!=null) return this._num(p.valor_a_receber.valor);
      if(Array.isArray(p.valores_a_receber) && p.valores_a_receber.length){
        let s=0,any=false; p.valores_a_receber.forEach(x=>{const n=this._num(x&&x.valor); if(n!=null){s+=n;any=true}});
        return any?s:null;
      }
      return null;
    },
    _recebido(p){ // recebido = LISTA de pagamentos
      const r=p.recebido; if(!Array.isArray(r)||!r.length) return {tem:false,txt:''};
      let s=0,any=false; r.forEach(x=>{const n=this._num(x&&(x.valor!=null?x.valor:x)); if(n!=null){s+=n;any=true}});
      if(any) return {tem:true, txt: this.money(s)+(r.length>1?` <span style="opacity:.6">(${r.length}×)</span>`:'')};
      return {tem:true, txt: `${r.length} pagamento${r.length>1?'s':''}`};
    },
    // máscara de CPF (000.000.000-00) / CNPJ (00.000.000/0000-00). Só formata; não valida.
    _mascaraDoc(v){ if(v==null||v==='') return ''; const d=String(v).replace(/\D/g,'');
      if(d.length===11) return d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4');
      if(d.length===14) return d.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,'$1.$2.$3/$4-$5');
      return String(v); },
    // rótulo humano da classe do documento (pro "consta em" e fonte da cessão)
    _classeRot(c){ const m={OFICIO_REQUISITORIO:'Ofício requisitório',PROCURACAO:'Procuração',
      HABILITACAO_HERDEIROS:'Habilitação de herdeiros',CESSAO_CREDITO:'Cessão de crédito',
      SENTENCA:'Sentença',DECISAO:'Decisão',DESPACHO:'Despacho',CUMPRIMENTO_SENTENCA:'Cumprimento de sentença',
      PLANILHA_CALCULO:'Planilha de cálculo',DOC_PESSOAL:'Documento pessoal',ALVARA:'Alvará',
      PAGAMENTO_COMPROVANTE:'Comprovante de pagamento',CERTIDAO_OBITO:'Certidão de óbito',CERTIDAO_CASAMENTO:'Certidão de casamento',
      CERTIDAO_NASCIMENTO:'Certidão de nascimento',FORMAL_PARTILHA:'Formal de partilha',ACORDAO:'Acórdão',ACORDO:'Acordo',
      PETICAO:'Petição',CONTRATO_HONORARIOS:'Contrato de honorários',PROCURACAO:'Procuração',SUBSTABELECIMENTO:'Substabelecimento',
      TRANSITO_JULGADO:'Trânsito em julgado',RECURSO:'Recurso',PENHORA:'Penhora'};
      const k=String(c==null?'':c).toUpperCase(); return m[k]||(k?k.charAt(0)+k.slice(1).toLowerCase().replace(/_/g,' '):''); },
    // ── CESSÃO DE CRÉDITO ── coleta de fichas[].eventos (relação+%/data) e
    // docs[].registros do CESSAO_CREDITO (CPF/CNPJ). Dedup por cedente>cessionário.
    // helpers de identidade p/ dedup da cessão
    _soDig(v){ return v==null?'':String(v).replace(/\D/g,''); },
    _normNome(s){ return String(s==null?'':s).normalize('NFD').replace(/\p{Diacritic}/gu,'').toUpperCase().replace(/[^A-Z0-9]/g,''); },
    _ehRotuloCess(s){ return /^(CEDENTE|CESSIONARI[OA]S?|CEDENTES)$/.test(this._normNome(s)); }, // modelo ecoou o rótulo como nome
    _nomeSim(a,b){ if(!a||!b) return false; if(a===b) return true;
      const s=a.length<b.length?a:b, l=a.length<b.length?b:a;
      if(s.length>=8 && l.startsWith(s)) return true;      // um é prefixo do outro
      let i=0; while(i<s.length && s[i]===l[i]) i++;         // prefixo comum longo (fundos: "PRIORITYFUNDODE…")
      return i>=15; },
    _ladoComp(dA,nA,dB,nB){ const da=this._soDig(dA), db=this._soDig(dB);
      if(da&&db) return da===db?'match':'conflito';
      const na=this._normNome(nA), nb=this._normNome(nB);
      if(na&&nb) return this._nomeSim(na,nb)?'match':'conflito';
      return 'incerto'; },                                   // um lado sem info → não afirma
    _mesmaCessao(a,b){
      const c=this._ladoComp(a.cedente_doc,a.cedente,b.cedente_doc,b.cedente);
      const s=this._ladoComp(a.cessionario_doc,a.cessionario,b.cessionario_doc,b.cessionario);
      if(c==='conflito'||s==='conflito') return false;       // lados divergem → cessões distintas
      return c==='match'||s==='match';                       // ≥1 lado casa e nenhum conflita
    },
    _coletaCessoes(fichas, docs){
      // 1) coleta bruta (docs[].registros do CESSAO_CREDITO têm CPF/CNPJ; fichas[].eventos têm %/data)
      const raw=[]; const nome=n=>this._ehRotuloCess(n)?null:(n||null);
      (docs||[]).forEach(d=>{ if(this._normNome(d.classe)!=='CESSAOCREDITO') return;
        const rs=Array.isArray(d.registros)?d.registros:(d.registros?[d.registros]:[]);
        rs.forEach(r=>{ const ced=r.cedente||{}, ces=r.cessionario||{};
          raw.push({cedente:nome(ced.nome||r.cedente_nome), cedente_doc:ced.cpf_cnpj||null,
            cessionario:nome(ces.nome||r.cessionario_nome), cessionario_doc:ces.cpf_cnpj||null,
            valor:r.valor, percentual:r.percentual, data:r.data, doc:d.classe||d.nome, conf:r.confianca||d.classe_conf}); }); });
      (fichas||[]).forEach(f=>{ (f.eventos||[]).forEach(ev=>{ if(this._normNome(ev.tipo)!=='CESSAO') return;
        raw.push({cedente:nome(ev.cedente_nome), cedente_doc:null, cessionario:nome(ev.cessionario_nome), cessionario_doc:null,
          valor:ev.valor, percentual:ev.percentual, data:ev.data, doc:ev.doc_classe, conf:ev.confianca}); }); });
      // descarta registros totalmente vazios (sem cedente, sem cessionário, sem valor)
      // exige PELO MENOS UM lado identificado (nome ou doc). Fragmento só-valor
      // (cedente/cessionário nulos) NÃO vira card — o valor já vem no fragmento nomeado.
      const util=raw.filter(r=>r.cedente||r.cessionario||r.cedente_doc||r.cessionario_doc);
      if(!util.length) return [];
      // 2) clusteriza por identidade (doc-digits OU nome normalizado/prefixo)
      const grupos=[];
      util.forEach(r=>{ let g=grupos.find(g=>g.some(x=>this._mesmaCessao(x,r))); if(g)g.push(r); else grupos.push([r]); });
      // 3) funde cada grupo num card: melhor nome (mais longo), doc, valores DISTINTOS
      const mNome=(g,k)=>g.map(x=>x[k]).filter(Boolean).sort((a,b)=>b.length-a.length)[0]||null;
      const pick=(g,k)=>g.map(x=>x[k]).find(v=>v!=null&&v!=='')||null;
      return grupos.map(g=>{
        const vals=[...new Set(g.map(x=>this._num(x.valor)).filter(v=>v!=null))];
        return {cedente:mNome(g,'cedente'), cedente_doc:pick(g,'cedente_doc'),
          cessionario:mNome(g,'cessionario'), cessionario_doc:pick(g,'cessionario_doc'),
          valores:vals, percentual:pick(g,'percentual'), data:pick(g,'data'), doc:pick(g,'doc'), conf:pick(g,'conf')}; });
    },
    renderCessao(fichas, docs){
      const cs=this._coletaCessoes(fichas, docs); if(!cs.length) return '';
      const plural=cs.length>1;
      let h=`<div class="sc-sec"><div class="sc-sec-t">Cessão de crédito <span class="sc-cesslabel">CESSÃO${plural?` ×${cs.length}`:''}</span></div>`;
      cs.forEach(c=>{
        const valTxt=(c.valores&&c.valores.length)? c.valores.map(v=>this.money(v)).join(' · ') : null;
        h+=`<div class="sc-cesscard">
          <div class="sc-cessflow">
            <div class="sc-cessside" style="--cs:#0ea5e9">
              <div class="sc-cessrole">Cedente · quem cede o crédito</div>
              <div class="sc-cessnome">${this.na(c.cedente)}</div>
              ${c.cedente_doc?`<div class="sc-cessdoc">${this.esc(this._mascaraDoc(c.cedente_doc))}</div>`:''}
            </div>
            <div class="sc-cessarrow">${c.percentual?`<span class="sc-cesspct">${this.esc(c.percentual)}</span>`:''}<span>➜</span></div>
            <div class="sc-cessside" style="--cs:#06b6d4">
              <div class="sc-cessrole">Cessionário · quem recebe</div>
              <div class="sc-cessnome">${this.na(c.cessionario)}</div>
              ${c.cessionario_doc?`<div class="sc-cessdoc">${this.esc(this._mascaraDoc(c.cessionario_doc))}</div>`:''}
            </div>
          </div>
          <div class="sc-cessmeta">
            ${valTxt?`<span><i>Valor${c.valores.length>1?'es':''} cedido${c.valores.length>1?'s':''}</i> ${valTxt}</span>`:''}
            ${c.data?`<span><i>Data</i> ${this.esc(c.data)}</span>`:''}
            ${c.doc?`<span><i>Fonte</i> ${this.esc(this._classeRot(c.doc))}</span>`:''}
            ${c.conf?this.confBadge(c.conf):''}
          </div>
        </div>`;
      });
      h+=`</div>`; return h;
    },
    // ESTÁGIO DO CRÉDITO + LINHA DO TEMPO — ancorado no que o modelo extraiu (abstém sem prova)
    _estagioCor(e){ return ({DC:'#f59e0b',PRE_PRECATORIO:'#eab308',PRECATORIO_EMITIDO:'#22c55e',PAGO:'#3b82f6',MORTO:'#ef4444',INDEFINIDO:'#71717a'})[e]||'#71717a' },
    _marcoCor(s){ return ({done:'#22c55e',pendente:'#f59e0b',desconhecido:'#52525b'})[s]||'#52525b' },
    _statusValorCor(s){ return ({EXPEDIDO:'#22c55e',HOMOLOGADO:'#3b82f6',REQUERIDO:'#f59e0b',INDEFERIDO:'#ef4444',EM_CALCULO:'#eab308'})[s]||'#71717a' },
    renderEstagio(e){
      if(!e || !e.estagio) return '';
      const cor=this._estagioCor(e.estagio);
      let h=`<div class="sc-sec sc-estagio"><div class="sc-sec-t">Estágio do crédito</div>`;
      // faixa do estágio + homologação
      h+=`<div class="sc-estagio-head">
        <span class="sc-estagio-badge" style="background:${cor}22;color:${cor};border-color:${cor}55">${this.esc(e.estagio_rotulo||e.estagio)}</span>`;
      if(e.confianca) h+=this.confBadge(e.confianca);
      if(e.homologado===true) h+=`<span class="sc-chip" style="background:rgba(59,130,246,.14);color:#60a5fa">cálculos homologados${e.homologacao_data?` · ${this.esc(e.homologacao_data)}`:''}</span>`;
      else if(e.homologado===false) h+=`<span class="sc-chip" style="background:rgba(245,158,11,.14);color:#f59e0b">cálculos não homologados</span>`;
      else h+=`<span class="sc-chip" style="background:var(--muted);color:var(--fg-subtle)" title="sem evidência no documento">homologação não identificada</span>`;
      h+=`</div>`;
      // linha do tempo — pontos por marco
      const marcos=Array.isArray(e.marcos)?e.marcos:[];
      if(marcos.length){
        // marco ATUAL = o último 'done' (onde o crédito está HOJE) → destaque "está aqui"
        let idxAtual=-1; marcos.forEach((m,i)=>{ if(m.status==='done') idxAtual=i; });
        h+=`<div class="sc-tl">`;
        marcos.forEach((m,i)=>{
          const mc=this._marcoCor(m.status); const atual=(i===idxAtual);
          const dt = m.data ? this.esc(m.data) : (m.status==='pendente'?'pendente':(m.status==='desconhecido'?'—':''));
          h+=`<div class="sc-tl-item${atual?' sc-tl-atual':''}">
            <div class="sc-tl-dot" style="background:${m.status==='done'?mc:'transparent'};border-color:${mc}"></div>
            <div class="sc-tl-body">
              <div class="sc-tl-rot">${this.esc(m.rotulo||m.chave||'')}${atual?' <span class="sc-tl-badge">estágio atual</span>':''}</div>
              <div class="sc-tl-meta"><span style="color:${mc}">${dt}</span>${m.fonte&&m.fonte!=='sem_ancora'?` <span class="sc-soft">· ${this.esc(m.fonte)}</span>`:''}</div>
            </div></div>`;
        });
        h+=`</div>`;
      }
      // próximos passos
      const ps=Array.isArray(e.proximos_passos)?e.proximos_passos:[];
      if(ps.length){
        h+=`<div class="sc-nextsteps"><div class="sc-nextsteps-t">Passos que faltam</div>`;
        ps.forEach(p=>h+=`<div class="sc-nextstep">→ ${this.esc(p.rotulo||p)}${p.detalhe?` <span style="opacity:.6">${this.esc(p.detalhe)}</span>`:''}</div>`);
        h+=`</div>`;
      }
      h+=`</div>`;
      return h;
    },
    // ── FAIXA-HERÓI — o número que decide o investimento (valor) + estágio + cessão + partes ativas
    _renderHero(r, fichas, partes, docs, valorProc, temValor){
      if(!partes.length) return '';
      const est=r.estagio||{};
      const ativas=partes.filter(p=>this._poloParte(p.papel).polo==='ativo').length;
      const temCessao=this._coletaCessoes(fichas, docs).length>0;
      const ec=est.estagio? this._estagioCor(est.estagio):'var(--fg-muted)';
      let h=`<div class="sc-hero2">
        <div class="sc-hero-val">
          <div class="sc-hero-lb">Valor total a receber</div>
          <div class="sc-hero-big">${temValor? this.money(valorProc) : '<span class="sc-hero-abst">modelo absteve</span>'}</div>
        </div>
        <div class="sc-hero-chips">`;
      if(est.estagio) h+=`<div class="sc-hero-chip"><span class="sc-hero-clb">Estágio</span><span class="sc-hero-cval" style="color:${ec}">${this.esc(est.estagio_rotulo||est.estagio)}</span></div>`;
      h+=`<div class="sc-hero-chip"><span class="sc-hero-clb">Partes ativas</span><span class="sc-hero-cval">${ativas}</span></div>`;
      h+=`<div class="sc-hero-chip"><span class="sc-hero-clb">Cessão de crédito</span><span class="sc-hero-cval" style="color:${temCessao?'#22d3ee':'var(--fg-muted)'}">${temCessao?'sim':'não'}</span></div>`;
      h+=`</div></div>`;
      return h;
    },
    // legenda das cores — colapsável (papel/polo/status/confiança), tira dúvida do investidor
    _renderLegenda(){
      const it=(c,t)=>`<span class="sc-lg-it"><i style="background:${c}"></i>${t}</span>`;
      return `<details class="sc-legenda"><summary>O que as cores significam</summary><div class="sc-lg-grid">`
        + it('#22c55e','Polo ativo · recebe') + it('#ef4444','Polo passivo · paga')
        + it('#22d3ee','Cessão · cessionário') + it('#a855f7','Herdeiro · sucessor')
        + it('#64748b','Advogado') + it('#3b82f6','Estágio · precatório emitido')
        + it('#22c55e','Confiança alta') + it('#f59e0b','Confiança média') + it('#ef4444','Confiança baixa')
        + `</div></details>`;
    },
    // ── ATRIBUTOS DO CRÉDITO — dados ricos dos leitores por evento (nº precatório,
    // honorários, preferência, cessão homologada). Só o que foi LIDO (nada de vazio).
    _atr(rot, val, cor){
      return `<div class="sc-atr"><span class="sc-atr-l">${this.esc(rot)}</span>`
        + `<b class="sc-atr-v"${cor?` style="color:${cor}"`:''}>${this.esc(val)}</b></div>`;
    },
    _renderAtributos(r){
      const a=r.atributos||{}; if(!a || !Object.keys(a).length) return '';
      let h=`<div class="sc-sec"><div class="sc-sec-t">Atributos do crédito</div><div class="sc-atrs">`;
      const p=a.precatorio||{};
      if(p.numero_precatorio) h+=this._atr('Nº do precatório', p.numero_precatorio, '#22c55e');
      if(p.tipo_requisicao)   h+=this._atr('Tipo de requisição', p.tipo_requisicao==='RPV'?'RPV (pequeno valor)':'Precatório');
      if(p.ano_orcamentario)  h+=this._atr('Exercício orçamentário', p.ano_orcamentario);
      if(a.preferencia){ const pf=a.preferencia; const m={IDOSO:'idoso',DOENCA_GRAVE:'doença grave',DEFICIENCIA:'deficiência'}[pf.motivo]||'sim';
        h+=this._atr('Preferência (fura fila)', m+(pf.data?` · ${pf.data}`:''), '#f59e0b'); }
      if(a.cessao_homologada) h+=this._atr('Cessão homologada em', a.cessao_homologada.data||'sim', '#22d3ee');
      const vl=a.valores||{};
      if(vl.valor_originario) h+=this._atr('Valor originário', this.money(vl.valor_originario));
      if(vl.valor_atualizado) h+=this._atr('Valor atualizado', this.money(vl.valor_atualizado), '#22c55e');
      if(vl.data_base) h+=this._atr('Data-base do cálculo', vl.data_base);
      (a.honorarios||[]).forEach(hn=>{ const t=hn.tipo==='CONTRATUAIS'?'contratuais':'sucumbenciais';
        const v=[hn.percentual,hn.valor&&this.money(hn.valor),hn.beneficiario].filter(Boolean).join(' · ')||'sim';
        h+=this._atr('Honorários '+t, v, '#a855f7'); });
      (a.impugnacoes||[]).forEach(im=>{ const v=[im.tipo,im.resultado,im.data].filter(Boolean).join(' · ')||'sim';
        h+=this._atr('Impugnação / embargos', v, '#ef4444'); });
      (a.penhoras||[]).forEach(pn=>{ const v=[pn.valor&&this.money(pn.valor),pn.data].filter(Boolean).join(' · ')||'sim';
        h+=this._atr('Penhora / gravame', v, '#ef4444'); });
      h+=`</div></div>`; return h;
    },
    // renderiza a resposta REAL do pod: {fichas(=partes), docs, tempos, contexto, avisos, estagio, atributos}
    renderFicha(r, compact){
      if(!r) return '';
      if(r.erro) return `<div class="sc-err">⚠ ${this.esc(r.erro)}${r.indisponivel?' — pod não configurado':''}</div>`;
      const fichas = Array.isArray(r.fichas)? r.fichas : (r.fichas? [r.fichas] : []);
      const docs = Array.isArray(r.docs)? r.docs : [];
      const ctx = r.contexto || {}; const tempos = r.tempos || {};
      const partes = fichas.filter(f=>f && (f.nome||f.papel||f.valor_a_receber||f.valores_a_receber||f.recebido||f.saldo!=null));
      const avisos = Array.isArray(r.avisos)? r.avisos : (Array.isArray(ctx.flags)? ctx.flags : []);
      const varas=ctx.varas||[], datas=ctx.datas_chave||[], desf=ctx.desfecho_por_grau||{},
            decisoes=ctx.decisoes||[], acordaos=ctx.acordaos||[];
      const temCtx = varas.length||datas.length||Object.keys(desf).length||decisoes.length||acordaos.length;
      // registros CRUS por-doc (docs[].registros é LISTA) — sinais que o modelo achou
      // mesmo sem consolidar uma ficha (ex.: valor+vara sem beneficiário atribuído)
      const registros=[];
      docs.forEach(d=>{ const rs=Array.isArray(d.registros)? d.registros : (d.registros? [d.registros] : []);
        rs.forEach(g=>{ if(g && (g.valor!=null||g.vara_comarca||g.natureza||g.data||g.nome)) registros.push({...g, _doc:d.classe||d.nome}); }); });
      let natureza=null, ente=null;
      registros.forEach(g=>{ natureza=natureza||g.natureza; ente=ente||g.ente_devedor||g.ente; });
      // ente devedor = a parte EXECUTADO (Fazenda/Estado/Município), se houver
      if(!ente){ const ex=partes.find(p=>(p.papel||'').toUpperCase()==='EXECUTADO'); if(ex) ente=ex.nome; }
      // "vazio de verdade" SÓ se não há nada: nem parte, nem doc, nem sinal, nem contexto, nem aviso
      if(!partes.length && !docs.length && !registros.length && !temCtx && !avisos.length)
        return `<div class="sc-err">Nenhuma ficha extraída deste PDF.</div>`;
      // valor do processo = soma dos valor_a_receber das partes (DERIVADO)
      let valorProc=0, temValor=false;
      partes.forEach(p=>{ const v=this._valorReceber(p); if(v!=null){valorProc+=v; temValor=true} });
      const ocrDocs = docs.filter(d=>d.paginas_ocr>0 || d.precisa_ocr);
      const totOcr = ocrDocs.reduce((s,d)=>s+(d.paginas_ocr||0),0);

      let h=`<div class="sc-ficha">`;
      // cabeçalho — título honesto: "Ficha extraída" ou "Sinais extraídos" (sem consolidar)
      h+=`<div class="sc-fhead"><div class="flex items-center gap-2 flex-wrap">
        <span class="text-sm font-semibold text-fg">${partes.length? 'Ficha extraída' : 'Sinais extraídos'}</span>`;
      if(ocrDocs.length) h+=`<span class="sc-chip" style="background:rgba(245,158,11,.14);color:#f59e0b" title="parte do texto veio de scan lido por OCR">📄 lido via OCR${totOcr?` (${totOcr} pág${totOcr>1?'s':''})`:''}</span>`;
      h+=`</div><div class="flex items-center gap-2">
        <span class="sc-fmeta">⏱ ${this.tempo(r)}${tempos.total_s!=null?` · modelo ${(+tempos.total_s).toFixed(1)}s`:''}</span>
        <span class="sc-chip" style="background:rgba(34,197,94,.12);color:#22c55e">só o modelo</span></div></div>`;
      // ── FAIXA-HERÓI — o TL;DR da decisão: valor total + estágio + cessão + partes ativas
      h += this._renderHero(r, fichas, partes, docs, valorProc, temValor);
      // ═══ ESTÁGIO DO CRÉDITO + LINHA DO TEMPO ═══
      h += this.renderEstagio(r.estagio || {});
      // ═══ ATRIBUTOS DO CRÉDITO (nº precatório, honorários, preferência…) ═══
      h += this._renderAtributos(r);
      // ═══ CESSÃO DE CRÉDITO — card dedicado (cedente → cessionário) ═══
      h += this.renderCessao(fichas, docs);
      // ── PROCEDÊNCIA (documentos lidos + avisos/abstenção): guardada pro RODAPÉ.
      //    É qualidade da leitura, não a substância — o valor/partes vêm ANTES.
      let secProc='';
      if(docs.length){
        const porClasse = {}; let ocrTot=0;
        docs.forEach(d=>{ const c=(d.classe||d.nome||'?'); porClasse[c]=(porClasse[c]||0)+1; if(d.paginas_ocr>0||d.precisa_ocr) ocrTot++; });
        const classes = Object.keys(porClasse).sort((a,b)=>porClasse[b]-porClasse[a]);
        secProc+=`<div class="sc-sec"><div class="sc-sec-t">Documentos lidos — ${docs.length} peça${docs.length>1?'s':''}, ${classes.length} tipo${classes.length>1?'s':''}${ocrTot?` · ${ocrTot} via OCR`:''}</div><div class="sc-docs">`;
        classes.forEach(c=>{ const n=porClasse[c];
          secProc+=`<span class="sc-docchip">${this.esc(this._classeRot(c)||c)}${n>1?` <span class="sc-soft">×${n}</span>`:''}</span>`; });
        secProc+=`</div></div>`;
      }
      if(avisos.length){
        const isAbst = a=>/abst[eéê]|absteve/i.test(a);
        const isInfo = a=>/detectad|regra |capa e-?saj|CAPA_ESAJ|ente devedor|EXECUTADO|proveni/i.test(a);
        const abst = avisos.filter(isAbst);
        const info = avisos.filter(a=>!isAbst(a) && isInfo(a));
        const probs = avisos.filter(a=>!isAbst(a) && !isInfo(a));
        if(abst.length){
          secProc+=`<div class="sc-honesto" title="${this.esc(abst.slice(0,15).join('  •  '))}">
            <span class="sc-honesto-ic">✓</span>
            <span>O modelo <b>absteve-se em ${abst.length} documento${abst.length>1?'s':''}</b> sem dado estruturável — preferiu <b>não responder a inventar</b>. <span class="sc-soft">Zero alucinação; passe o mouse pra ver quais.</span></span>
          </div>`;
        }
        if(info.length){ secProc+=`<div class="sc-info">`; info.forEach(a=>secProc+=`<div>◈ ${this.esc(a)}</div>`); secProc+=`</div>`; }
        if(probs.length){ secProc+=`<div class="sc-avisos">`; probs.forEach(a=>secProc+=`<div>⚠ ${this.esc(a)}</div>`); secProc+=`</div>`; }
      }
      if(partes.length){
        // crédito
        h+=`<div class="sc-sec"><div class="sc-sec-t">Crédito</div><dl class="sc-kv">
          <dt>Valor do processo</dt><dd>${temValor? this.money(valorProc) : '<span class="sc-na">—</span>'}</dd>
          <dt>Natureza</dt><dd>${this.na(natureza)}</dd>
          <dt>Ente devedor</dt><dd>${this.na(ente)}</dd></dl></div>`;
        // partes — AGRUPADAS POR POLO (ativo recebe · passivo paga · advogados)
        h+=`<div class="sc-sec"><div class="sc-sec-t">Partes (${partes.length})</div>`;
        // grupos: cada polo + os advogados JÁ ENQUADRADOS nele; advogado sem lado
        // vai pra um grupo próprio (honesto). 'lado' pinta a faixa (ativo/passivo).
        const GRUPOS=[
          {key:'ativo',      titulo:'Polo ativo · quem recebe',            cor:'#22c55e', lado:'ativo'},
          {key:'advAtivo',   titulo:'Advogados do polo ativo',            cor:'#22c55e', lado:'ativo',   adv:true},
          {key:'passivo',    titulo:'Polo passivo · quem paga',           cor:'#ef4444', lado:'passivo'},
          {key:'advPassivo', titulo:'Advogados do polo passivo',          cor:'#ef4444', lado:'passivo', adv:true},
          {key:'advSem',     titulo:'Advogados · lado não identificado',  cor:'#94a3b8', adv:true},
          {key:'outro',      titulo:'Outras partes',                      cor:'#3b82f6'},
        ];
        const buckets={ativo:[],passivo:[],advAtivo:[],advPassivo:[],advSem:[],outro:[]};
        partes.forEach(p=>{ const pl=this._poloParte(p.papel).polo;
          if(pl==='repr'){ const ap=this._advogadoPolo(p, partes);
            buckets[ap==='ativo'?'advAtivo':ap==='passivo'?'advPassivo':'advSem'].push(p); }
          else (buckets[pl]||buckets.outro).push(p);
        });
        GRUPOS.forEach(g=>{
          const lst=buckets[g.key]; if(!lst.length) return;
          let tot=0,temTot=false; if(g.key==='ativo') lst.forEach(p=>{const v=this._valorReceber(p); if(v!=null){tot+=v;temTot=true}});
          h+=`<div class="sc-polo${g.lado?` sc-polo-${g.lado}`:''}${g.adv?' sc-polo-adv':''}" style="--polo:${g.cor}">
            <div class="sc-polo-head">
              <span class="sc-polo-dot"></span>
              <span class="sc-polo-t">${g.titulo}</span>
              <span class="sc-polo-n">${lst.length}</span>
              ${g.key==='ativo'&&temTot?`<span class="sc-polo-tot">total a receber&nbsp;<b>${this.money(tot)}</b></span>`:''}
            </div>
            <div class="sc-pgrid">`;
          lst.forEach(p=>{ h+=this._parteCard(p, g.key==='ativo'); });
          h+=`</div></div>`;
        });
        h+=`</div>`;
      } else if(registros.length){
        // achou sinais mas não atribuiu beneficiário → não consolidou ficha (honesto, não inventa dono)
        h+=`<div class="sc-sec"><div class="sc-sec-t">Sinais extraídos (sem ficha consolidada)</div>`;
        h+=`<p style="font-size:.72rem;color:var(--fg-subtle);margin-bottom:.5rem;line-height:1.4">O modelo leu os documentos e extraiu os dados abaixo, mas <b>não atribuiu um beneficiário</b> — então <b>não inventou</b> um dono pro valor e não consolidou uma ficha.</p>`;
        registros.forEach(g=>{
          const bits=[]; const v=this._num(g.valor);
          if(v!=null) bits.push(`<div class="sc-val"><span>valor</span><b>${this.money(v)}</b></div>`);
          if(g.nome) bits.push(`<div class="sc-val"><span>nome</span><b>${this.esc(g.nome)}</b></div>`);
          if(g.vara_comarca) bits.push(`<div class="sc-val"><span>vara/comarca</span><b>${this.esc(g.vara_comarca)}</b></div>`);
          if(g.natureza) bits.push(`<div class="sc-val"><span>natureza</span><b>${this.esc(g.natureza)}</b></div>`);
          if(g.data) bits.push(`<div class="sc-val"><span>data</span><b>${this.esc(g.data)}</b></div>`);
          if(!bits.length) return;
          h+=`<div class="sc-parte"><div class="sc-parte-top"><span class="sc-papel" style="background:#3b82f622;color:#60a5fa">${this.esc(g._doc||'doc')}</span>${g.confianca?this.confBadge(g.confianca):''}</div><div class="sc-vals">${bits.join('')}</div></div>`;
        });
        h+=`</div>`;
      }
      // jurimetria (contexto do processo)
      if(varas.length||datas.length||Object.keys(desf).length||decisoes.length||acordaos.length){
        h+=`<div class="sc-sec"><div class="sc-sec-t">Jurimetria (contexto do processo)</div>`;
        if(varas.length||Object.keys(desf).length){
          h+=`<dl class="sc-kv">`;
          varas.forEach(v=>h+=`<dt>Vara / comarca</dt><dd>${this.esc(v.vara_comarca||v)}${v.primeira_data?` <span style="opacity:.55">(${this.esc(v.primeira_data)})</span>`:''}</dd>`);
          Object.entries(desf).forEach(([g,d])=>h+=`<dt>Desfecho ${this.esc(g)}</dt><dd>${this.esc(d)}</dd>`);
          h+=`</dl>`;
        }
        if(datas.length){
          h+=`<div class="sc-timeline" style="margin-top:.5rem">`;
          datas.forEach(e=>h+=`<div class="sc-ev"><div>${this.esc(e.tipo||'')}</div><div class="sc-ev-d">${this.esc(e.data||'')}${e.doc_classe?` · ${this.esc(e.doc_classe)}`:''}</div></div>`);
          h+=`</div>`;
        }
        if(decisoes.length||acordaos.length) h+=`<div class="sc-conf" style="margin-top:.4rem">${decisoes.length} decisão(ões) · ${acordaos.length} acórdão(s)</div>`;
        h+=`</div>`;
      }
      // procedência (documentos lidos + abstenção) no RODAPÉ — depois de valor/partes
      h += secProc;
      // legenda das cores (papel/polo/status/confiança) — colapsável, tira dúvida
      h += this._renderLegenda();
      h+=`</div>`;
      return h;
    },
  }
}
