    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    mem_limit: 768m
    deploy:
      # 2026-05-14: 50 → 90 → 120 → 160 → 180. Bottleneck upstream PJe.
      # 2026-06-08: 160 → 72 (pós-OOM — gargalo principal, mantém prioridade).
      # 2026-07-02: 72 → 6 (rebalance — TJMG 100% enriquecido, 0 fila).
      replicas: 6
    restart: unless-stopped

  worker_tjma:
    image: voyager-web:prod
    command: python manage.py rqworker enrich_tjma
    env_file: .env
    volumes:
      - .:/app
    # HTTP com proxy rotativo: cada IP novo abre pool próprio. 1024 (default
    # do Docker) esgota e o worker passa a falhar TUDO com errno 24, inclusive
    # o que iria pra proxy saudável — perda de cobertura silenciosa.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    mem_limit: 768m
    deploy:
      # Ramp inicial 10 réplicas (mesmo critério do TRF5 no 1º deploy:
      # 10 a 100% → safe escalar). TJMA é PJe padrão, mesmo bottleneck
      # upstream do TJMG; volume DJEN observado ≈ 11k itens/dia.
      # 2026-06-08: 10 → 8 (pós-OOM).
      # 2026-07-02: 8 → 12 (rebalance — TJMA 14%, progredindo).
      replicas: 12
    restart: unless-stopped

  worker_tjsp:
    image: voyager-web:prod
    command: python manage.py rqworker enrich_tjsp
    env_file: .env
    volumes:
      - .:/app
    # HTTP com proxy rotativo: cada IP novo abre pool próprio. 1024 (default
    # do Docker) esgota e o worker passa a falhar TUDO com errno 24, inclusive
    # o que iria pra proxy saudável — perda de cobertura silenciosa.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    mem_limit: 640m
    deploy:
      # 2026-05-24: criado com 60 réplicas. e-SAJ é HTTP puro (sem Selenium);
      # cada job faz 2 requests (open.do + search.do→show.do). Sem proxy pool
      # configurado: e-SAJ tolera taxa moderada de IP único; subir réplicas se
      # rate-limit aparecer e considerar adicionar ProxyScrapePool no enricher.
      # 2026-06-08: 60 → 40 (pós-OOM — maior volume, mantém pool relevante).
      # 2026-07-02: 40 → 6 (rebalance — TJSP 100% enriquecido, 0 fila).
      replicas: 6
    restart: unless-stopped

  worker_tjdft:
    image: voyager-web:prod
    command: python manage.py rqworker enrich_tjdft
    env_file: .env
    volumes:
      - .:/app
    # HTTP com proxy rotativo: cada IP novo abre pool próprio. 1024 (default
    # do Docker) esgota e o worker passa a falhar TUDO com errno 24, inclusive
    # o que iria pra proxy saudável — perda de cobertura silenciosa.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    mem_limit: 512m
    deploy:
      # Ramp inicial 10 réplicas (mesmo critério do TJMA/TRF5 1º deploy).
      # TJDFT é REST API (Spring Boot atrás de AWS ALB), cada job faz 4 GETs
      # JSON (lista + dados + 3 polos) — bem mais barato que PJe JSF clássico
      # mas com round-trip TLS adicional por polo. Sem ProxyScrapePool: API
      # pública tolera taxa moderada de IP único; observar rate-limit antes
      # de escalar.
      # 2026-06-08: 10 → 8 (pós-OOM).
      # 2026-07-02: 8 → 2 (rebalance — TJDFT 100% enriquecido, 0 fila).
      replicas: 2
    restart: unless-stopped

  # ---- Adicionados no recon 2026-06-29 (consulta pública aberta) ----
  # Religados 2026-07-01 após o fix do incidente: reabastecer com lock+query
  # sargável (2a81d3a) e índice composto (tribunal, enriquecimento_status)
  # (migration 0038) — pending-scan caiu de 388s p/ 0,09s. Réplicas dimensionadas
  # por backlog; escalar conforme o DB aguentar (os antigos rodam 320/host).
  worker_tjce:
    image: voyager-web:prod
    command: python manage.py rqworker enrich_tjce
    env_file: .env
    volumes: [".:/app"]
    # HTTP com proxy rotativo: cada IP novo abre pool próprio. 1024 (default
    # do Docker) esgota e o worker passa a falhar TUDO com errno 24, inclusive
    # o que iria pra proxy saudável — perda de cobertura silenciosa.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    mem_limit: 768m
    deploy: {replicas: 16}  # PJe clássico, ~1,5M @ 3% (rebalance 2026-07-02: 4→16)
    restart: unless-stopped

  worker_tjap:
    image: voyager-web:prod
    command: python manage.py rqworker enrich_tjap
    env_file: .env
    volumes: [".:/app"]
    # HTTP com proxy rotativo: cada IP novo abre pool próprio. 1024 (default
    # do Docker) esgota e o worker passa a falhar TUDO com errno 24, inclusive
    # o que iria pra proxy saudável — perda de cobertura silenciosa.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    mem_limit: 768m
    deploy: {replicas: 8}   # PJe clássico, ~235k @ 13% (rebalance 2026-07-02: 2→8)
    restart: unless-stopped

  worker_tjpe:
    image: voyager-web:prod
    command: python manage.py rqworker enrich_tjpe
    env_file: .env
    volumes: [".:/app"]
    # HTTP com proxy rotativo: cada IP novo abre pool próprio. 1024 (default
