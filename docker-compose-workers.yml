    # o que iria pra proxy saudável — perda de cobertura silenciosa.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    mem_limit: 768m
    deploy: {replicas: 14}  # PJe clássico, ~1,47M @ 8% (rebalance 2026-07-02: 3→14)
    restart: unless-stopped

  worker_tjrj:
    image: voyager-web:prod
    command: python manage.py rqworker enrich_tjrj
    env_file: .env
    volumes: [".:/app"]
    # HTTP com proxy rotativo: cada IP novo abre pool próprio. 1024 (default
    # do Docker) esgota e o worker passa a falhar TUDO com errno 24, inclusive
    # o que iria pra proxy saudável — perda de cobertura silenciosa.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    mem_limit: 768m
    deploy: {replicas: 24}  # PJe clássico, 3,3M @ 1% / 6,86M na fila (rebalance 2026-07-02: 2→24 — maior backlog)
    restart: unless-stopped

  worker_tjro:
    image: voyager-web:prod
    command: python manage.py rqworker enrich_tjro
    env_file: .env
    volumes: [".:/app"]
    # HTTP com proxy rotativo: cada IP novo abre pool próprio. 1024 (default
    # do Docker) esgota e o worker passa a falhar TUDO com errno 24, inclusive
    # o que iria pra proxy saudável — perda de cobertura silenciosa.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    mem_limit: 768m
    deploy: {replicas: 5}   # PJe clássico, ~327k @ 5% — host 403 a datacenter IP, cap baixo (rebalance 2026-07-02: 1→5)
    restart: unless-stopped

  worker_tjac:
    image: voyager-web:prod
    command: python manage.py rqworker enrich_tjac
    env_file: .env
    volumes: [".:/app"]
    # HTTP com proxy rotativo: cada IP novo abre pool próprio. 1024 (default
    # do Docker) esgota e o worker passa a falhar TUDO com errno 24, inclusive
    # o que iria pra proxy saudável — perda de cobertura silenciosa.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    mem_limit: 640m
    deploy: {replicas: 5}   # e-SAJ, ~111k @ 22% (rebalance 2026-07-02: 2→5)
    restart: unless-stopped

  worker_tjmt:
    image: voyager-web:prod
    command: python manage.py rqworker enrich_tjmt
    env_file: .env
    volumes: [".:/app"]
    # HTTP com proxy rotativo: cada IP novo abre pool próprio. 1024 (default
    # do Docker) esgota e o worker passa a falhar TUDO com errno 24, inclusive
    # o que iria pra proxy saudável — perda de cobertura silenciosa.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    mem_limit: 512m
    deploy: {replicas: 14}  # REST (SPA), ~2,1M @ 17% (rebalance 2026-07-02: 4→14)
    restart: unless-stopped

  worker_tjpa:
    image: voyager-web:prod
    command: python manage.py rqworker enrich_tjpa
    env_file: .env
    volumes: [".:/app"]
    # HTTP com proxy rotativo: cada IP novo abre pool próprio. 1024 (default
    # do Docker) esgota e o worker passa a falhar TUDO com errno 24, inclusive
    # o que iria pra proxy saudável — perda de cobertura silenciosa.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    mem_limit: 512m
    deploy: {replicas: 8}   # REST (consilium), ~2,1M @ 1% — throttle 429, cap baixo (rebalance 2026-07-02: 4→8)
    restart: unless-stopped

  worker_tjal:
    image: voyager-web:prod
    command: python manage.py rqworker enrich_tjal
    env_file: .env
    volumes:
      - .:/app
    # HTTP com proxy rotativo: cada IP novo abre pool próprio. 1024 (default
    # do Docker) esgota e o worker passa a falhar TUDO com errno 24, inclusive
    # o que iria pra proxy saudável — perda de cobertura silenciosa.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    mem_limit: 640m
    deploy:
      # TJAL roda o MESMO e-SAJ do TJSP (HTTP puro, 2 requests/job: open.do +
      # search.do→show.do). Volume muito menor que TJSP — ramp inicial 10
      # réplicas (critério do 1º deploy de tribunal novo).
      # 2026-06-08: 10 → 8 (pós-OOM).
      # 2026-06-17: 8 → 24. Passou a usar o pool ProxyScrape (PREFER_CORTEX=False,
      # ver enrichers/esaj.py) → paraleliza pelos 2500+ IPs; sobe pra drenar o
      # backlog acumulado enquanto o enrich falhava no Cortex. mem_limit protege.
      # 2026-07-02: 24 → 12 (rebalance — TJAL 90%, trim p/ os famintos).
      replicas: 12
    restart: unless-stopped

  worker_default:
    image: voyager-web:prod
    command: python manage.py rqworker default
    env_file: .env
    volumes:
      - .:/app
    mem_limit: 512m
    deploy:
      replicas: 2
    restart: unless-stopped

  worker_ingestion:
    image: voyager-web:prod
    # --with-scheduler é OBRIGATÓRIO aqui: `reprocessar_janela` usa
    # `enqueue_in` pra ADIAR o dia quando o circuito do DJEN abre, e o RQ só
    # promove job agendado se algum worker estiver rodando o scheduler. Sem
    # isto o adiamento vira limbo — medido em 19/08/2026: 4.189 dias venceram
    # a hora e ficaram parados no ScheduledJobRegistry, sem virar falha e sem
    # voltar pra fila. Pior que falhar, porque nenhum alarme dispara.
    command: python manage.py rqworker --with-scheduler djen_ingestion djen_backfill
    env_file: .env
    volumes:
      - .:/app
    # _ingest_day_por_uf abre 27 fetches paralelos (UFs) × proxy retries. Sem
    # ulimit alto, esgota FDs do container e os jobs morrem com errno 24
    # ("Too many open files"), perdendo dados nas janelas de 1 dia.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    mem_limit: 1g
    deploy:
      # 2026-05-24: 4 → 8 — backfill simultâneo de 3 tribunais novos (TRF2/4/6).
      # 2026-08-19: 8 → 14 — com os índices de I/O no lugar, o gargalo deixou de
      # ser o banco (2 GB/s → 33 MB/s de leitura) e passou a ser a coleta. Load
      # da .102 caiu de 33 pra 13,6 em 24 vCPU. Teto em 14 e não mais: são 1 GB
      # cada, e a máquina tinha 16 GB livres — 14 deixa ~10 de folga.
      replicas: 14
    restart: unless-stopped

  worker_datajud:
    image: voyager-web:prod
    command: python manage.py rqworker datajud
    env_file: .env
    volumes:
      - .:/app
    # HTTP com proxy rotativo: cada IP novo abre pool próprio. 1024 (default
    # do Docker) esgota e o worker passa a falhar TUDO com errno 24, inclusive
    # o que iria pra proxy saudável — perda de cobertura silenciosa.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    mem_limit: 512m
    deploy:
      # Datajud é leve (1 request HTTP por processo).
      # 2026-05-14: 90 → 20 (fila zerada, RAM cedida pros enrich).
      # 2026-05-24: 20 → 60 — 3 tribunais novos em backfill (TRF2/4/6) puxam
      # auto-enqueue Datajud por cada mov ingerida; pool dimensionado pra fluxo.
      # 2026-06-08: 60 → 24 (pós-OOM — fila leve, re-escalar se backlog subir).
      replicas: 24
    restart: unless-stopped

  worker_varredura:
    image: voyager-web:prod
    command: python manage.py rqworker varredura
    env_file: .env
    environment:
      # Chapa máxima SEM estourar a APIKey compartilhada: 8 réplicas × ~7,5
      # req/min ≈ 60 rpm. Com o sync por processo consumindo ~26 rpm, ficam 86
      # dos 100 globais. Este é o teto seguro — passar dele exige subir também
      # DATAJUD_RATE_LIMIT_RPM, e o risco vira a chave do CNJ (incidente
      # 2026-07-02: _search pendurado, fila em 63M jobs).
      - DATAJUD_VARREDURA_RPM=60
    volumes:
      - .:/app
    # Cada job segura uma página de 10k docs em memória (~4MB de JSON) e faz
    # bulk no ES; 512m é folgado.
    # HTTP com proxy rotativo: cada IP novo abre pool próprio. 1024 (default
    # do Docker) esgota e o worker passa a falhar TUDO com errno 24, inclusive
    # o que iria pra proxy saudável — perda de cobertura silenciosa.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    mem_limit: 512m
    deploy:
      replicas: 8
    restart: unless-stopped

  worker_classificacao:
    image: voyager-web:prod
    command: python manage.py rqworker classificacao
    env_file: .env
    volumes:
      - .:/app
    # Carrega o modelo ML (ClassificadorVersao ativa) na memória do processo.
    mem_limit: 1g
    deploy:
      replicas: 8
    restart: unless-stopped

  # ---- Workers Jusbrasil-compat (ES indexação + PDF download) ----
  # Adicionados 2026-08-01: Fase A-I do plano Jusbrasil-compat.
  # Conectam no ES e MinIO da VM voyager-search (.105) via .env.

  worker_es_index:
    image: voyager-web:prod
    command: python manage.py rqworker es_index
    env_file: .env
    volumes:
      - .:/app
    # Cada job agora carrega um LOTE (500 movs) em vez de uma. 512m não cabe
    # o lote + o texto das publicações; 1g com folga.
    mem_limit: 1g
    deploy:
      # 8 → 24 em 18/08/2026. O gatilho documentado aqui era "fila > 100k";
      # ela estava em 1.825.123, ou seja 18× o gatilho, e SUBINDO — o índice
      # corria ~178 milhões de docs atrás do Postgres. O dreno por réplica é
      # o mesmo; o que muda é que cada job passou a valer 500 publicações
      # (search/jobs.py::indexar_movimentacoes_bulk).
      replicas: 24
    restart: unless-stopped

  worker_pdf_download:
    image: voyager-web:prod
    command: python manage.py rqworker pdf_download
    env_file: .env
    volumes:
      - .:/app
    # Download de PDFs (requests.get + save no MinIO). 512m chega.
    # HTTP com proxy rotativo: cada IP novo abre pool próprio. 1024 (default
    # do Docker) esgota e o worker passa a falhar TUDO com errno 24, inclusive
    # o que iria pra proxy saudável — perda de cobertura silenciosa.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    mem_limit: 512m
    deploy:
      # 4 réplicas — não compete com a DJEN (cada PDF é 1 GET).
      # Escalar se backlog de PDFs crescer.
      replicas: 4
    restart: unless-stopped

  worker_monitoring:
    image: voyager-web:prod
    command: python manage.py rqworker monitoring
    env_file: .env
    volumes:
      - .:/app
    # Varredura ES + webhook delivery (HTTP POST). Leve.
    mem_limit: 512m
    deploy:
      # 2 réplicas — varredura é diária, webhook delivery é esporádico.
      replicas: 2
    restart: unless-stopped

  # ---- Diários próprios (3ª porta do acervo — .ia/DIARIOS.md) ----
  # Adicionado 2026-08-20. Sobe DESLIGADO na prática: o agendamento é o
  # `DIARIOS_SCHEDULER_ENABLED` (default False) no scheduler do .103, então
  # enquanto ninguém ligar a chave este worker fica ocioso na fila vazia.
  # A fila `diarios` é separada da `djen_*` de propósito (core/settings.py):
  # a unidade de trabalho aqui é um CADERNO INTEIRO, e um job desses na fila
  # da ingestão empurraria a fronteira diária pro fim da linha.
  worker_diarios:
    image: voyager-web:prod
    command: python manage.py rqworker diarios
    env_file: .env
    volumes:
      - .:/app
    # HTTP com proxy rotativo: cada IP novo abre pool próprio. 1024 (default
    # do Docker) esgota e o worker passa a falhar TUDO com errno 24, inclusive
    # o que iria pra proxy saudável — perda de cobertura silenciosa.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # mem_limit 1g — a conta, com números MEDIDOS em 20/08/2026:
    #   · baseline de um rqworker Django nesta VM: 213-311 MiB
    #     (`docker stats` dos worker_ingestion, mesma imagem)
    #   · pico do pipeline no MAIOR caderno conhecido (DJE/TJSP Capital Parte I
    #     de 12/03/2025, 36 MB / 4.229 páginas), rodando o segmentador REAL:
    #     125 MB com PyMuPDF (era 406 MB com pypdf — ADR-031)
    #   ⇒ ~311 + 125 ≈ 436 MB de pico esperado. 1g é 2,3× isso.
    # A folga NÃO é gordura: o `dejt` usa a MESMA fila e o segmentador dele
    # ainda é pypdf acumulando o texto das 13.853 páginas numa lista, com
    # cadernos que passam de 100 MB — isso NÃO foi medido. Enquanto não for,
    # o teto de 1g é o que transforma "estourou a RAM" em morte de container
    # (RQ re-enfileira) em vez de OOM de host (incidente 2026-06-08).
    mem_limit: 1g
    deploy:
      # 2 réplicas — conservador de propósito, e o gargalo é CPU, não rede:
      #   · 1 caderno = 44,8 s de CPU medidos (16,3 s de extração PyMuPDF +
      #     ~30 s de segmentação); o download leva 0,2-1,2 s e o teto de
      #     conduta é DIARIOS_RPS_TJSP_DJE=1,0 req/s.
      #   · 2 réplicas ocupam ~2 dos 24 vCPU da .102, que já roda 14 workers
      #     de ingestão + 24 de es_index com load average 12.
      #   · RAM: 2 × 1g = 2 GiB dos ~15 GiB disponíveis (`free -h`, 20/08).
      #   · vazão: ~160 cadernos/h. O backfill do tjsp-dje é da ordem de
      #     37 mil cadernos (4.162 edições × ~9) ≈ 460 h de CPU ⇒ ~10 dias
      #     com 2 réplicas. Escalar isso é decisão DEPOIS de medir o efeito
      #     no Postgres (já disk-I/O-bound), não antes: §5.2 do DIARIOS.md.
      replicas: 2
    restart: unless-stopped
